<section id="projects">
  <div class="container-custom">
    <h2 class="section-title">Projects</h2>

    <div class="projects-grid">
      @for(project of projects; track project.title) {
        <div class="glass-card project-card" [class.featured]="project.featured">
          <div class="project-card-body">
            <div class="project-header">
              <span class="category-badge">{{ project.category }}</span>
            </div>

            <h3 class="project-title">{{ project.title }}</h3>
            <p class="project-desc">{{ project.description }}</p>

            <div class="tech-tags">
              @for(tech of project.technologies; track tech) {
                <span class="tech-tag">{{ tech }}</span>
              }
            </div>

            <div class="project-actions">
              @if(project.github) {
                <a [href]="project.github" target="_blank" class="btn-project-link">
                  <i class="fab fa-github"></i> View Project <i class="fa-solid fa-arrow-right icon-arrow"></i>
                </a>
              } @else {
                <span class="in-progress-label"><i class="fa-solid fa-spinner fa-spin me-1"></i> Active Development</span>
              }
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</section>
