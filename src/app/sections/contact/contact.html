<section id="contact">

  <div class="container-custom">

    <h2 class="section-title">
      Let's Connect
    </h2>

    <p class="contact-text">
      I'm always interested in discussing software development,
      AI applications, and exciting opportunities.
    </p>

    <div class="contact-grid">

      @for(contact of contacts; track contact.title) {

      <a
        [href]="contact.link"
        target="_blank"
        class="contact-card">

        <i [class]="contact.icon"></i>

        <h4>
          {{ contact.title }}
        </h4>

      </a>

      }

    </div>

  </div>

</section>
